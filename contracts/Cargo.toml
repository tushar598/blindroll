[workspace]
members = ["blindroll", "mock-usdc"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/blindroll/blindroll"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
