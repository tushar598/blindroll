[package]
name = "blindroll"
description = "Blindroll: claim-based payroll. Runs are funded in USDC and paid out by Merkle-proof claims."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] } # "unstable" exposes env::ecrecover

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
near-workspaces = "0.24.0"
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
